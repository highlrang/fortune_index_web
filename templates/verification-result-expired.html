<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{appName}} 인증 링크 만료</title>
    <style>
      :root {
        color-scheme: dark light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(223, 188, 95, 0.12), transparent 32%),
          radial-gradient(circle at bottom right, rgba(255, 178, 84, 0.14), transparent 28%),
          linear-gradient(135deg, #12162a 0%, #4f355b 52%, #101427 100%);
        color: #f3efff;
      }

      .shell {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 560px;
        padding: 32px 28px;
        border-radius: 28px;
        border: 1px solid rgba(245, 158, 11, 0.24);
        background: rgba(26, 24, 52, 0.76);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 24px 60px rgba(6, 8, 18, 0.32);
      }

      .brand {
        margin: 0 0 12px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #dfbe66;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(245, 158, 11, 0.28);
        background: rgba(245, 158, 11, 0.14);
        color: #f6d48f;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        text-align: center;
        font-size: 32px;
        line-height: 1.3;
      }

      p {
        margin: 0;
        text-align: center;
        font-size: 15px;
        line-height: 1.8;
        color: rgba(241, 239, 255, 0.8);
      }

      .actions {
        margin-top: 28px;
        display: grid;
        gap: 12px;
      }

      .button {
        display: block;
        width: 100%;
        padding: 16px 20px;
        border-radius: 18px;
        text-align: center;
        text-decoration: none;
        font-size: 15px;
        font-weight: 700;
      }

      .button-primary {
        color: #161223;
        background: linear-gradient(135deg, rgba(223, 188, 95, 0.96) 0%, rgba(234, 213, 158, 0.92) 100%);
        border: 1px solid rgba(223, 188, 95, 0.58);
      }

      .button-secondary {
        color: #f3efff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(245, 158, 11, 0.22);
      }

      .hint {
        margin-top: 18px;
        font-size: 13px;
        color: rgba(241, 239, 255, 0.58);
      }

      @media (max-width: 640px) {
        .card {
          padding: 28px 20px;
          border-radius: 24px;
        }

        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="brand">{{appName}}</p>
        <div class="badge">Link Expired</div>
        <h1>인증 링크가 만료되었습니다</h1>
        <p>보안을 위해 인증 링크는 일정 시간이 지나면 사용할 수 없습니다. 아래 경로로 돌아가 새 인증 메일을 요청해 주세요.</p>

        <div class="actions">
          <a class="button button-primary" href="{{fallbackUrl}}">다시 인증 요청하기</a>
          <a class="button button-secondary" href="{{deepLinkUrl}}">앱 열기</a>
        </div>

        <p class="hint">앱을 사용 중이라면 앱을 다시 열어 인증 절차를 이어갈 수 있습니다.</p>
      </section>
    </main>
  </body>
</html>
